<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Beam Roller</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23ff4d6d'/%3E%3Cpath d='M50 8a42 42 0 0 1 0 84z' fill='%23f4f4f8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hud-level"></div>
      <div id="hud-stats"><span class="gem-icon">&#9670;</span> <span id="hud-gems">0/0</span> &middot; <span id="hud-time">0.0s</span> &middot; <span id="hud-falls">0</span> falls</div>
      <div id="hud-run"><span id="hud-score">0</span> <span id="hud-chain"></span> <span id="hud-delta"></span></div>
    </div>
    <div class="hud-right">
      <button id="btn-mute" class="icon" title="Sound" aria-label="Toggle sound">&#128266;</button>
      <button id="btn-calib" class="icon hidden" title="Recalibrate tilt" aria-label="Recalibrate tilt">&#9678;</button>
      <button id="btn-pause" class="icon" title="Pause" aria-label="Pause">&#10074;&#10074;</button>
    </div>
    <canvas id="minimap" aria-label="Track map"></canvas>
  </div>

  <div id="toast"></div>
  <div id="count"></div>
  <div id="joystick" class="hidden"><div id="joy-knob"></div></div>

  <div id="menu" class="screen">
    <div class="panel">
      <h1>Beam Roller</h1>
      <p class="sub">Keep the ball on the beams. Collect gems, beat the clock.</p>
      <div id="total-stars"></div>
      <button id="daily-btn" class="daily-btn"></button>
      <div id="level-list"></div>
      <div class="control-row">
        <span>Ghost of best run</span>
        <div class="seg-group">
          <button id="ghost-on" class="seg">On</button>
          <button id="ghost-off" class="seg">Off</button>
        </div>
      </div>
      <div class="control-row">
        <span>Path guide</span>
        <div class="seg-group">
          <button id="guide-on" class="seg">On</button>
          <button id="guide-off" class="seg">Off</button>
        </div>
      </div>
      <div id="control-row" class="control-row hidden">
        <span>Control</span>
        <div class="seg-group">
          <button id="ctl-tilt" class="seg">Tilt</button>
          <button id="ctl-touch" class="seg">Touch</button>
        </div>
      </div>
      <div id="sens-row" class="control-row hidden">
        <span>Sensitivity</span>
        <div class="seg-group">
          <button data-sens="low" class="seg">Low</button>
          <button data-sens="normal" class="seg">Normal</button>
          <button data-sens="high" class="seg">High</button>
        </div>
      </div>
      <p class="hint" id="menu-hint"></p>
      <button id="btn-menu-mute" class="ghost small"></button>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart" class="ghost">Restart level</button>
      <button id="btn-pause-calib" class="ghost">Recalibrate tilt</button>
      <button id="btn-menu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="win" class="screen hidden">
    <div class="panel">
      <h2 id="win-title">Level complete!</h2>
      <div id="win-stars"><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span></div>
      <ul id="win-goals"></ul>
      <p id="win-stats"></p>
      <button id="btn-next">Next level</button>
      <button id="btn-share" class="hidden">Share result</button>
      <button id="btn-retry" class="ghost">Play again</button>
      <button id="btn-win-menu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="rotate"><div>&#128241;<br>Please turn your phone upright</div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
