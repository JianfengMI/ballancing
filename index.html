<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Beam Roller</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hud-level"></div>
      <div id="hud-stats"><span id="hud-time">0.0s</span> &middot; <span id="hud-falls">0</span> falls</div>
    </div>
    <div class="hud-right">
      <button id="btn-calib" class="icon hidden" title="Recalibrate tilt" aria-label="Recalibrate tilt">&#9678;</button>
      <button id="btn-pause" class="icon" title="Pause" aria-label="Pause">&#10074;&#10074;</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="joystick" class="hidden"><div id="joy-knob"></div></div>

  <div id="menu" class="screen">
    <div class="panel">
      <h1>Beam Roller</h1>
      <p class="sub">Keep the ball on the beams.</p>
      <div id="level-list"></div>
      <div id="control-row" class="hidden">
        <span>Control</span>
        <div class="seg-group">
          <button id="ctl-tilt" class="seg">Tilt</button>
          <button id="ctl-touch" class="seg">Touch</button>
        </div>
      </div>
      <p class="hint" id="menu-hint"></p>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart" class="ghost">Restart level</button>
      <button id="btn-pause-calib" class="ghost">Recalibrate tilt</button>
      <button id="btn-menu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="win" class="screen hidden">
    <div class="panel">
      <h2 id="win-title">Level complete!</h2>
      <p id="win-stats"></p>
      <button id="btn-next">Next level</button>
      <button id="btn-retry" class="ghost">Play again</button>
      <button id="btn-win-menu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="rotate"><div>&#128241;<br>Please turn your phone upright</div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
